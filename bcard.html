<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Card</title>
  <style>
    body {
      background: #fceabb;
      background: linear-gradient(to right, #f8b500, #fceabb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .card {
      width: 320px;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 1s;
      transform-style: preserve-3d;
    }

    .card.open .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .card-front {
      background: #ff9800;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .card-back {
      background: #ffffff;
      color: #ff9800;
      transform: rotateY(180deg);
      font-size: 18px;
      line-height: 1.4;
    }

    .balloons {
      position: absolute;
      bottom: -60px;
      font-size: 30px;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" onclick="openCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-front">
        🎁 Click to Open 🎁
      </div>
      <div class="card-back">
        🎉 Happy Birthday! 🎂<br><br>
        May your day be filled with joy, laughter, and sweet surprises.<br>
        You deserve all the happiness today and always 💖
      </div>
    </div>
  </div>

  <script>
    function openCard() {
      document.querySelector(".card").classList.toggle("open");
    }
  </script>

</body>
</html>
