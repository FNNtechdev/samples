<!DOCTYPE html>
<html>
<head>
<title>Advanced Bank Table</title>

<style>
body {
    font-family: Arial, sans-serif;
}

table {
    border-collapse: collapse;
    width: 70%;
    margin: 20px auto;
}

caption {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

th, td {
    border: 1px solid #333;
    padding: 10px;
    text-align: right;
}

th {
    background-color: #2c3e50;
    color: white;
}

td:first-child, th:first-child {
    text-align: left;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

tfoot {
    font-weight: bold;
    background-color: #dfe6e9;
}
</style>

</head>

<body>

<table>

<caption>Bank Transactions Summary</caption>

<thead>
<tr>
<th>Month</th>
<th>Withdrawn ($)</th>
<th>Credit ($)</th>
<th>Balance ($)</th>
</tr>
</thead>

<tbody>
<tr>
<td>January</td>
<td>250.00</td>
<td>660.50</td>
<td>410.50</td>
</tr>

<tr>
<td>February</td>
<td>135.55</td>
<td>895.20</td>
<td>1170.15</td>
</tr>

<tr>
<td>March</td>
<td>300.00</td>
<td>500.00</td>
<td>1370.15</td>
</tr>
</tbody>

<tfoot>
<tr>
<td>Total</td>
<td>685.55</td>
<td>2055.70</td>
<td>1370.15</td>
</tr>
</tfoot>

</table>

</body>
</html>
